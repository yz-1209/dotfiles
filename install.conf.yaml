- defaults:
    link:
      create: true
      relink: true

- clean:
    ~/:
      force: true
    ~/.config:
      recursive: true

- link:
    ~/.zshrc: configs/zshrc
    ~/.config/starship.toml: configs/starship.toml
    ~/.ideavimrc: configs/ideavimrc
    ~/.gitconfig: configs/gitconfig
    ~/.config/kitty/kitty.conf: configs/kitty.conf
    ~/.config/ghostty/config: configs/ghostty/config
    ~/Library/Application Support/Code/User/settings.json:
      if: "[ `uname` = Darwin ]"
      path: configs/vscode-settings.json
